<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Privacy Policy — Housemore</title>
<meta name="description" content="Housemore's privacy policy.">
<link rel="canonical" href="https://www.housemore.app/privacy.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0D9488;
    --teal-light: #14B8A6;
    --teal-dark: #0F766E;
    --teal-faint: #F0FDFA;
    --teal-muted: #CCFBF1;
    --dark: #0D1F1E;
    --mid: #374151;
    --muted: #6B7280;
    --border: #E5E7EB;
    --bg: #FFFFFF;
    --bg-soft: #F9FAFB;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--dark);
    background: var(--bg);
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 6%;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(229,231,235,0.6);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 36px;
    height: 36px;
  }

  .nav-logo-text {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: -0.3px;
  }

  main {
    flex: 1;
    padding: 120px 6% 80px;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }

  .doc-eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 12px;
  }

  .doc-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 600;
    color: var(--dark);
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
  }

  .pending-notice {
    background: var(--teal-faint);
    border: 1px solid var(--teal-muted);
    border-radius: 12px;
    padding: 20px 22px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--mid);
  }

  .pending-notice strong { color: var(--teal-dark); }

  .pending-notice a { color: var(--teal-dark); }

  footer {
    background: #0A1614;
    padding: 40px 6%;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: auto;
    text-align: center;
  }

  .footer-copy {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
  }

  .footer-copy a {
    color: rgba(255,255,255,0.85);
  }

  @media (max-width: 600px) {
    main { padding-top: 100px; }
  }

  :focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <svg class="nav-logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="navGradPrivacy" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#14B8A6"/>
          <stop offset="100%" stop-color="#0D9488"/>
        </linearGradient>
      </defs>
      <rect width="36" height="36" rx="8" fill="url(#navGradPrivacy)"/>
      <rect x="10.5" y="14" width="3.5" height="13" rx="1.75" fill="white"/>
      <rect x="22" y="14" width="3.5" height="13" rx="1.75" fill="white"/>
      <rect x="10.5" y="19" width="15" height="3" rx="1.5" fill="white"/>
      <polyline points="8.5,14 18,7.5 27.5,14" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="nav-logo-text">Housemore</span>
  </a>
</nav>

<main>
  <p class="doc-eyebrow">Legal</p>
  <h1 class="doc-title">Privacy Policy</h1>
  <div class="pending-notice">
    <strong>[[LEGAL COPY PENDING]]</strong> — this page is a placeholder. The finished privacy policy has not been published yet.
    Questions in the meantime? <a href="contact.html">Contact us</a>.
  </div>
</main>

<footer>
  <div class="footer-copy">© 2026 Housemore. All rights reserved. · <a href="index.html">Back to Housemore</a></div>
</footer>

</body>
</html>
